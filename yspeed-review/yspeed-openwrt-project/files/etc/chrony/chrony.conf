# YS-GPS-12832 GNSS-disciplined NTP service.
#
# Single interface: eth0.2 is the WAN uplink and takes DHCP from the existing
# LAN. There is no LAN interface, no bridge and no static management address.
#
# GNSS SHM and PPS remain monitor-only (noselect) until UTC validity, fix state
# and PPS-to-UTC second association have been verified on hardware. The vendor
# firmware shipped with pps_enabled=0, so the PPS path has never run on this
# board: promote it only after /dev/pps0 is observed asserting once a second.
refclock SHM 0 refid GPS precision 1e-1 poll 0 noselect
refclock PPS /dev/pps0 refid PPS lock GPS precision 1e-7 poll 0 noselect

# Upstream fallbacks by literal address: they resolve and sync without DNS,
# which matters because this project must not depend on the DHCP lease
# supplying working resolvers. NIST and Cloudflare, one of each.
server 132.163.96.1 iburst
server 162.159.200.1 iburst

# Serve clients on the WAN uplink. Restricted to the private ranges a plant LAN
# would use; this is not an open relay for the internet.
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16
binddevice eth0.2
bindacqdevice eth0.2

# Maintain the DS1307 RTC from the disciplined system clock. The RTC is
# holdover only: it drifts minutes per month and must never be a time source.
rtcsync
makestep 1.0 3
