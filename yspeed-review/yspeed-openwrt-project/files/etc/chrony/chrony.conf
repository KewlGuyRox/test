# YS-GPS-12832 GNSS-disciplined NTP service.
#
# Single interface: eth0.2 is the WAN uplink and takes DHCP from the existing
# LAN. There is no LAN interface or bridge; static addressing is available on WAN.
#
# gpsd device order is intentional: ttyS1 is receiver 1 (SHM 0/1, time);
# ttyS2 is receiver 2 (SHM 2/3, UI telemetry only). Chrony selects SHM 0.
# gpsd provides receiver time on SHM 0; the kernel exposes the GPIO PPS signal
# on /dev/pps0. PPS needs the SHM source to associate pulses with UTC seconds.
# Do not add a fixed SHM offset until measured on the attached receiver.
#
# PPS on GPIO11 was verified operational on 2026-11-05: ppstest /dev/pps0
# returned consecutive assertions about one second apart (sequences 3140-3144
# at 1793860737.002265851, ...738, ...739, ...740, ...741.002268005, and later
# 3370-3381) on IRQ40, while /dev/pps1 timed out. The captured
# /proc/interrupts corroborates it: "40: 49145 10000600.gpio 11 pps.-1".
#
# Both refclocks are therefore selectable, with prefer on PPS because it is the
# microsecond-class source. "lock GPS" keeps PPS subordinate to a valid SHM
# second, so an unlatched receiver cannot move the clock by itself. Still
# required: regression-test on this firmware (6.12 + new DTS) that the
# assertions survive and that chrony actually locks PPS to a real fix.
refclock SHM 0 refid GPS precision 1e-1 poll 0
refclock PPS /dev/pps0 refid PPS lock GPS precision 1e-7 poll 0 prefer

# If GNSS and network time are both unavailable, serve the RTC-seeded local
# clock at stratum 10 after allowing five minutes for real sources to appear.
# This is degraded holdover, not an accurate UTC source.
local stratum 10 orphan waitunsynced 300

# Upstream fallbacks by literal address, so DNS is not required for time
# service. DHCP still accepts the user's normal DNS settings for LuCI/packages.
server 132.163.96.1 iburst
server 162.159.200.1 iburst

# Serve clients on the WAN uplink. Restricted to the private ranges a plant LAN
# would use; this is not an open relay for the internet.
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16
binddevice eth0.2
bindacqdevice eth0.2

# Maintain the DS1307 RTC from the disciplined system clock. It seeds boot
# time/holdover; the RTC is not selected as a precision reference clock.
rtcsync
makestep 1.0 3
