# YS-GPS-12832 GNSS-disciplined NTP service.
# Ethernet addressing is dynamic: DHCP or operator-configured static IPv4 may
# use any subnet. Gateway and DNS are supplied by the deployment network.
# Local NTP service must continue to operate without either during isolated tests.
#
# GNSS SHM and PPS remain monitor-only until UTC validity, fix state, and
# PPS-to-UTC second association have been independently verified.
refclock SHM 0 refid GPS precision 1e-1 poll 0 noselect
refclock PPS /dev/pps0 refid PPS lock GPS precision 1e-7 poll 0 noselect

# Independent network references. Chrony selects/combines only sources that
# pass its source-selection and distance/jitter checks; these are not blindly
# averaged and are fallbacks when GNSS/PPS is unavailable or untrusted.
# Pool directives allow DNS-based address discovery when deployment DNS exists.
pool time.nist.gov iburst maxsources 1
pool time.cloudflare.com iburst maxsources 1

# Serve clients on the Ethernet service interface regardless of its IPv4 subnet.
allow all
binddevice eth0.2
bindacqdevice eth0.2

# Maintain the DS1307 RTC from the disciplined system clock.
rtcsync
makestep 1.0 3
