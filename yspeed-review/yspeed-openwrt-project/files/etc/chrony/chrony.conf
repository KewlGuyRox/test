# YS-GPS-12832 isolated-LAN time service.
# No default gateway or DNS is intentionally supplied by DHCP.
# Do not query public NTP servers on this appliance.
#
# GNSS data from gpsd is monitor-only until UTC association is verified.
# PPS is also monitor-only until pulse/NMEA second alignment is measured.
refclock SHM 0 refid GPS precision 1e-1 poll 0 offset 0.5 delay 0.1 noselect
refclock PPS /dev/pps0 refid PPS lock GPS precision 1e-7 poll 0 noselect

# Serve NTP only to the directly connected management subnet.
allow 10.10.50.0/24
binddevice eth0.2
bindacqdevice eth0.2

# Keep the DS1307 RTC maintained only after Chrony has a valid system clock.
rtcsync
makestep 1.0 3
