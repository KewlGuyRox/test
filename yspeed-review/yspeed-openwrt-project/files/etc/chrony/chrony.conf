# External NTP remains the selected source until GNSS/PPS association is proven.
server time.nist.gov iburst maxpoll 6
server time.cloudflare.com iburst maxpoll 6

# Permit NTP clients on the connected upstream LAN via the WAN VLAN interface.
allow 0.0.0.0/0
binddevice eth0.2
bindacqdevice eth0.2

# Keep RTC synchronized after Chrony has a valid system clock.
rtcsync
makestep 1.0 3

# GNSS/PPS remain monitor-only while the 9600-baud UART backlog is unresolved.
refclock SHM 0 refid GPS precision 1e-1 poll 0 offset 0.5 delay 0.1 noselect
refclock PPS /dev/pps0 refid PPS lock GPS precision 1e-7 poll 0 noselect
