# YS-GPS-12832 GNSS-disciplined NTP service.
# Ethernet addressing is intentionally dynamic: DHCP or operator-configured
# static IPv4 may use any subnet. Do not hard-code a management subnet here.
# No default gateway or DNS is required for local NTP service.
# Do not query public NTP servers unless an operator explicitly configures them.
#
# GNSS data from gpsd is monitor-only until UTC association is verified.
# PPS is monitor-only until pulse/NMEA second alignment is measured.
refclock SHM 0 refid GPS precision 1e-1 poll 0 offset 0.5 delay 0.1 noselect
refclock PPS /dev/pps0 refid PPS lock GPS precision 1e-7 poll 0 noselect

# Serve NTP to clients on the Ethernet interface, whatever IPv4 subnet it uses.
# binddevice limits the service socket to eth0.2; allow all avoids subnet coupling.
allow all
binddevice eth0.2
bindacqdevice eth0.2

# Keep the DS1307 RTC maintained from the system clock.
rtcsync
makestep 1.0 3
