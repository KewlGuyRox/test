name: YSPEED OpenWrt RAM-boot build

on:
  workflow_dispatch:
  push:
    branches:
      - yspeed/ramboot-network-and-build-fixes
    paths:
      - '.github/workflows/yspeed-ramboot-build.yml'
      - 'yspeed-review/yspeed-openwrt-project/**'

permissions:
  contents: read

# Keep only the newest build for this branch. A newer commit supersedes
# any in-flight or queued build of an older source revision.
concurrency:
  group: yspeed-openwrt-ramboot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install OpenWrt build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl libelf-dev libzstd-dev perl python3 python3-dev \
            python3-pyelftools python3-yaml xsltproc ccache

      - name: Restore OpenWrt download and compiler caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/yspeed-openwrt-25.12.6/openwrt/dl
            ~/.cache/ccache
          key: yspeed-openwrt-${{ runner.os }}-25.12.6-${{ hashFiles('yspeed-review/yspeed-openwrt-project/feeds.conf', 'yspeed-review/yspeed-openwrt-project/config/ramips-mt76x8-yspeed.config', 'yspeed-review/yspeed-openwrt-project/board/mt7628an_yspeed_ys-gps-12832.dts') }}
          restore-keys: |
            yspeed-openwrt-${{ runner.os }}-25.12.6-

      - name: Configure compiler cache
        run: |
          mkdir -p "$HOME/.cache/ccache"
          ccache --set-config=max_size=5G
          ccache --zero-stats

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/chromium /usr/local/share/powershell
          sudo apt-get clean
          df -h /

      - name: Build YS-GPS-12832 initramfs uImage
        working-directory: yspeed-review/yspeed-openwrt-project
        env:
          JOBS: '4'
          CCACHE_DIR: ~/.cache/ccache
        run: |
          bash scripts/build.sh "$RUNNER_TEMP/yspeed-openwrt-25.12.6"

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Publish validated RAM-boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yspeed-ramboot-openwrt-25.12.6
          path: ${{ runner.temp }}/yspeed-openwrt-25.12.6/artifacts/
          if-no-files-found: warn
          retention-days: 30
